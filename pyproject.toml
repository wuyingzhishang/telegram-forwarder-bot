[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-forwarder-bot"
version = "0.1.0"
description = "Self-hosted Telegram channel message forwarding bot"
requires-python = ">=3.10"
dependencies = [
  "python-telegram-bot>=22,<23",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.115,<1", "pydantic>=2.7,<3", "uvicorn[standard]>=0.34,<1"]
user-session = ["telethon>=1.40,<2", "qrcode>=7.4,<9"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
forwarder = "forwarder.bot:main"
forwarder-user-session-login = "forwarder.user_session_login:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forwarder = ["web/*.html", "web/assets/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
